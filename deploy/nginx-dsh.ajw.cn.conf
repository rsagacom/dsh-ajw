# dsh 安家网 · 源站 nginx 配置（域名由 Cloudflare 管理）
# 放置于 /etc/nginx/sites-available/dsh-ajw.cn.conf 并软链到 sites-enabled
# 用法前请按注释调整: 站点根目录、证书路径

# Cloudflare 回源 IP 段（用于 real_ip 还原访客真实 IP）
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name dsh.ajw.cn;

    # Cloudflare 全站代理时，将 80 端口 HTTP 请求回源后跳转 HTTPS
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    # 若希望允许直接 HTTP 访问可注释上面 if 块并取消下行注释
    # return 200 "dsh.ajw.cn";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dsh.ajw.cn;

    # 站点根目录: 指向本仓库的 site/ 目录
    root /srv/www/dsh-ajw/site;
    index index.html;

    # Cloudflare 源站证书（Cloudflare 面板 SSL/TLS -> Origin Server -> Create Certificate）
    ssl_certificate     /etc/nginx/certs/dsh.ajw.cn.pem;
    ssl_certificate_key /etc/nginx/certs/dsh.ajw.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 数据文件: 每日更新，短缓存 + 每次抓取后由 crawler 调 Cloudflare purge 双保险
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 静态资源: 1 天缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # 页面: 不缓存
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # 访问日志（配合 real_ip 记录真实访客）
    access_log /var/log/nginx/dsh-ajw.cn.access.log;
    error_log  /var/log/nginx/dsh-ajw.cn.error.log;
}
